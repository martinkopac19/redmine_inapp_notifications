    legend_general: "In-app notifications"
    note: "A bell in the header showing what would otherwise only arrive by e-mail. E-mail notifications are unaffected — this is a second channel, not a replacement, so everyone who gets the mail also gets the bell."
    setting_enabled: "Enable in-app notifications"
    setting_enabled_info: "Turning this off hides the bell and stops recording new notifications. Existing ones are kept."
    setting_panel_limit: "Rows in the panel"
    setting_panel_limit_info: "How many notifications the bell panel shows. The full page is paginated and not affected. 5-100."
    setting_merge_window: "Reaction merge window (minutes)"
    setting_merge_window_info: "If somebody removes a like and gives it again within this time, it stays a single notification instead of piling up. 1-1440, 30 by default."
    setting_keep_read_days: "Keep read notifications (days)"
    setting_keep_read_days_info: "Read notifications have served their purpose, so they go first. Default 30."
    setting_keep_all_days: "Keep everything (days)"
    setting_keep_all_days_info: "Upper bound for anything, read or not. Default 180."
    setting_lazy_purge: "Clean up automatically"
    setting_lazy_purge_info: "Deletes expired notifications from within a normal request, so no cron job is needed. It only runs when there is actually something to delete."
